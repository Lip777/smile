<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Привет, name!</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            color: #ffffff;
            
            /* ВОТ ЗДЕСЬ МЫ СТАВИМ ВАШУ КАРТИНКУ НА ФОН ВСЕЙ СТРАНИЦЫ */
            background-image: url('nik.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #000000;
            
            height: 100vh;
            overflow: hidden;
        }

        /* Центрируем блок с невидимым полем ввода и кнопкой ровно посередине экрана */
        .center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Этот блок теперь прозрачный и накладывается прямо поверх нарисованной рамки на картинке */
        #formBlock {
            width: 610px;  /* Ширина должна совпадать с размером рамки на картинке */
            height: 140px; /* Высота под нарисованную рамку */
            position: relative;
            background: transparent; 
            padding: 0;
        }

        #formBlock h2 {
            display: none; /* Скрываем стандартный текст */
        }

        /* Невидимое поле ввода — встает ровно в левое окошко "ENTER YOUR NAME" */
        input[type="text"] {
            position: absolute;
            left: 11%;
            top: 52%;
            transform: translateY(-50%);
            width: 40%;
            height: 42px;
            background: transparent; 
            border: none;
            outline: none;
            color: #ffffff; /* Цвет текста при вводе имени */
            font-size: 24px;
            font-weight: bold;
            padding: 0 10px;
            box-sizing: border-box;
        }

        /* Картинка-кнопка OKEY — встает ровно поверх нарисованной кнопки */
        #okButton {
            position: absolute;
            right: 11%;
            top: 52%;
            transform: translateY(-50%);
            width: 32%; 
            height: auto;
            cursor: pointer;
            transition: transform 0.1s ease, filter 0.2s ease;
        }

        #okButton:hover {
            filter: brightness(1.2); /* Подсветка при наведении */
        }

        #okButton:active {
            transform: translateY(-50%) scale(0.95); /* Эффект нажатия */
        }

        #messageBlock {
            background: rgba(0,0,0,0.8);
            padding: 25px;
            border-radius: 12px;
            min-width: 280px;
            border: 2px solid #00ffff;
        }
    </style>
</head>
<body>

<div class="center" id="formBlock">
    <h2>Введи своё имя</h2>
    <input type="text" id="nameInput" placeholder="" autocomplete="off">
    <!-- Ваша желтая кнопка-картинка OKEY -->
    <img src="ok.png" id="okButton" alt="OKEY">
</div>

<div class="center" id="messageBlock" style="display:none;">
    <h1 id="messageText"></h1>
</div>

<audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
    Ваш браузер не поддерживает аудио.
</audio>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('SW зарегистрирован!'));
        });
    }
</script>
</body>
</html>
