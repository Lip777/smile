<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Привет, name!</title>
    
    <!-- ПОДКЛЮЧАЕМ МАНИФЕСТ -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            color: #ffffff;
            background-image: url('nik.png'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #000000;
            height: 100vh;
            overflow: hidden;
        }

        /* Центрируем невидимый контейнер строго по вашей радужной рамке */
        .center {
            position: absolute;
            top: 61.5%; /* Смещаем контейнер чуть ниже, прямо на уровень радужной полосы */
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Контейнер теперь имеет точные пропорции вашей нарисованной радужной панели */
        #formBlock {
            width: 550px;  /* Ширина всей нарисованной рамки (от ENTER до OKEY) */
            height: 80px;  /* Высота нарисованной рамки */
            position: relative;
            background: transparent; /* УБРАЛИ ЧЕРНОЕ ОКНО И ФИОЛЕТОВУЮ РАМКУ */
            padding: 0;
            border: none;
            box-shadow: none;
        }

        #formBlock h2 {
            display: none; /* Прячем текст «ВВЕДИ СВОЁ ИМЯ» */
        }

        /* Поле ввода встает точно в левую черную область фоновой картинки */
        input[type="text"] {
            position: absolute;
            left: 5%;         /* Отступ слева внутри контейнера */
            top: 50%;
            transform: translateY(-50%);
            width: 44%;       /* Растягиваем поле на всю длину черного окошка */
            height: 50px;     /* Высота под рамку */
            background: transparent; /* Делаем поле полностью прозрачным */
            border: none;     /* Убираем рамку */
            outline: none;    /* Убираем контур при клике */
            color: #ffffff;   /* Цвет букв, когда пользователь пишет имя */
            font-size: 24px;
            font-weight: bold;
            font-family: sans-serif;
            padding: 0 15px;
            box-sizing: border-box;
        }

        /* Желтая кнопка ok.png встает точно поверх нарисованной OKEY */
        #okButton {
            position: absolute;
            right: 4.5%;      /* Отступ справа внутри контейнера */
            top: 50%;
            transform: translateY(-50%);
            width: 35%;       /* Растягиваем картинку точно по размеру нарисованной кнопки */
            height: 54px;     /* Высота кнопки */
            cursor: pointer;
            transition: transform 0.1s ease, filter 0.2s ease;
        }

        /* Эффект легкого свечения при наведении на кнопку */
        #okButton:hover {
            filter: brightness(1.2);
        }

        /* Эффект нажатия (кнопка слегка вдавливается) */
        #okButton:active {
            transform: translateY(-50%) scale(0.96);
        }

        /* Экран финального приветствия (оставляем аккуратное окошко) */
        #messageBlock {
            background: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border-radius: 15px;
            min-width: 300px;
            border: 3px solid #00ffff;
            box-shadow: 0 0 20px #00ffff;
        }
    </style>
</head>
<body>

<div class="center" id="formBlock">
    <h2>Введи своё имя</h2>
    <input type="text" id="nameInput" placeholder="" autocomplete="off">
    <img src="ok.png" id="okButton" alt="OKEY">
</div>

<div class="center" id="messageBlock" style="display:none;">
    <h1 id="messageText"></h1>
</div>

<!-- Музыка -->
<audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
    Ваш браузер не поддерживает аудио.
</audio>

<script>
    const okButton = document.getElementById('okButton');
    const nameInput = document.getElementById('nameInput');
    const formBlock = document.getElementById('formBlock');
    const messageBlock = document.getElementById('messageBlock');
    const messageText = document.getElementById('messageText');
    const bgMusic = document.getElementById('bgMusic');

    okButton.addEventListener('click', () => {
        const name = nameInput.value.trim();
        if (name !== "") {
            bgMusic.play().catch(e => console.log("Музыка заблокирована браузером"));
            formBlock.style.display = 'none';
            messageBlock.style.display = 'block';
            messageText.innerText = `Привет, ${name}!`;
        } else {
            alert("Пожалуйста, введи имя!");
        }
    });

    // РЕГИСТРАЦИЯ SERVICE WORKER
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('SW зарегистрирован!'));
        });
    }
</script>
</body>
</html>
