    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            color: #ffffff;
            background-image: url('nik.png'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #000000;
            height: 100vh;
            overflow: hidden;
        }

        /* Центрируем и опускаем контейнер точно на уровень радужной полосы */
        .center {
            position: absolute;
            top: 62%; /* Подогнали высоту, чтобы опустить элементы ниже */
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Расширили контейнер, чтобы он покрывал всю нарисованную рамку */
        #formBlock {
            width: 580px;  /* Точная ширина всей вашей нарисованной панели */
            height: 60px;  /* Высота внутренней черной зоны */
            position: relative;
            background: transparent; 
            padding: 0;
            border: none;
            box-shadow: none;
        }

        #formBlock h2 {
            display: none; 
        }

        /* Поле ввода встает точно в левую черную область фоновой картинки */
        input[type="text"] {
            position: absolute;
            left: 2%;         /* Максимально прижали к левому краю рамки */
            top: 50%;
            transform: translateY(-50%);
            width: 50%;       /* Растянули поле ровно до середины панели */
            height: 46px;     /* Высота под внутреннее окошко */
            background: transparent; 
            border: none;     
            outline: none;    
            color: #39ff14;   /* Сделали вводимый текст неоново-зеленым под цвет ваших цифр */
            font-size: 26px;  /* Крупный шрифт */
            font-weight: bold;
            font-family: sans-serif;
            padding: 0 10px;
            box-sizing: border-box;
        }

        /* Желтая кнопка ok.png растягивается и встает поверх нарисованной OKEY */
        #okButton {
            position: absolute;
            right: 2%;        /* Прижали кнопку к самому правому краю рамки */
            top: 50%;
            transform: translateY(-50%);
            width: 35.5%;     /* Увеличили ширину, чтобы кнопка полностью растянулась */
            height: 52px;     /* Точная высота под нарисованную кнопку */
            cursor: pointer;
            transition: transform 0.1s ease, filter 0.2s ease;
        }

        #okButton:hover {
            filter: brightness(1.2);
        }

        #okButton:active {
            transform: translateY(-50%) scale(0.96);
        }

        #messageBlock {
            background: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border-radius: 15px;
            min-width: 300px;
            border: 3px solid #00ffff;
            box-shadow: 0 0 20px #00ffff;
        }
    </style>
