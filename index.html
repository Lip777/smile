<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Привет, name!</title>
    
    <!-- ПОДКЛЮЧАЕМ МАНИФЕСТ -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            color: #ffffff;
            /* Ваша главная фоновая картинка с неоновой рамкой */
            background-image: url('main_bg.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #000000;
            transition: background-image 0.8s ease;
            height: 100vh;
            overflow: hidden;
        }

        /* Центрируем блок формы поверх фоновой картинки */
        .center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Контейнер для точного позиционирования элементов */
        #formBlock {
            width: 600px;  /* Примерная ширина вашей нарисованной рамки */
            height: 150px; /* Примерная высота вашей нарисованной рамки */
            position: relative;
        }

        /* Скрываем текст "Введи своё имя", так как на картинке уже есть "ENTER YOUR NAME" */
        #formBlock h2 {
            display: none;
        }

        /* Поле ввода встает точно в левую черную область нарисованной рамки */
        input[type="text"] {
            position: absolute;
            left: 11%;
            top: 50%;
            transform: translateY(-50%);
            width: 40%;
            height: 40px;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 22px;
            font-family: sans-serif;
            padding: 0 10px;
        }

        /* Кнопка становится прозрачной и встает точно поверх нарисованной кнопки "OKEY" */
        button {
            position: absolute;
            right: 12%;
            top: 50%;
            transform: translateY(-50%);
            width: 32%;
            height: 50px;
            background: transparent;
            border: none;
            cursor: pointer;
            color: transparent; /* Скрываем стандартный текст кнопки */
            outline: none;
        }

        #messageBlock {
            background: rgba(0,0,0,0.8);
            padding: 30px;
            border-radius: 15px;
            min-width: 300px;
            border: 2px solid #ff00ff; /* Красивая рамка для сообщения */
        }
    </style>
</head>
<body>

<div class="center" id="formBlock">
    <h2>Введи своё имя</h2>
    <input type="text" id="nameInput" placeholder="" autocomplete="off">
    <button id="okButton">OK</button>
</div>

<div class="center" id="messageBlock" style="display:none;">
    <h1 id="messageText"></h1>
</div>

<!-- Музыка -->
<audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
    Ваш браузер не поддерживает аудио.
</audio>

<script>
    // РЕГИСТРАЦИЯ SERVICE WORKER
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('SW зарегистрирован!'));
        });
    }
</script>
</body>
</html>
