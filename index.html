<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Привет, name!</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            color: #ffffff;
            background-image: url('nik.png'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #000000;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Контейнер теперь гибкий и занимает максимум 90% ширины экрана телефона */
        #formBlock {
            width: 90%;
            max-width: 580px; /* На ПК он не станет больше 580px */
            /* Используем aspect-ratio, чтобы блок сжимался пропорционально вашей картинке */
            aspect-ratio: 580 / 60; 
            position: relative;
            background: transparent; 
            padding: 0;
            border: none;
            box-shadow: none;
            /* Смещаем блок на уровень вашей радужной полосы на фоне */
            margin-top: 12vh; 
        }

        #formBlock h2 {
            display: none; 
        }

        /* Адаптивное поле ввода */
        input[type="text"] {
            position: absolute;
            left: 2%;         
            top: 50%;
            transform: translateY(-50%);
            width: 50%;       
            height: 80%; /* Высота подстраивается под пропорции рамки */    
            background: transparent; 
            border: none;     
            outline: none;    
            color: #39ff14;   
            font-size: 4.5vw; /* Размер шрифта зависит от ширины экрана */
            font-weight: bold;
            font-family: sans-serif;
            padding: 0 2%;
            box-sizing: border-box;
        }

        /* Адаптивная желтая кнопка ok.png */
        #okButton {
            position: absolute;
            right: 2%;        
            top: 50%;
            transform: translateY(-50%);
            width: 35.5%;     
            height: 85%; /* Высота подстраивается под пропорции кнопки */
            cursor: pointer;
            object-fit: contain; /* Картинка внутри кнопки не будет искажаться */
            transition: transform 0.1s ease, filter 0.2s ease;
        }

        #okButton:hover {
            filter: brightness(1.2);
        }

        #okButton:active {
            transform: translateY(-50%) scale(0.96);
        }

        /* Экран финального приветствия */
        #messageBlock {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            padding: 25px;
            border-radius: 15px;
            width: 80%;
            max-width: 300px;
            border: 3px solid #00ffff;
            box-shadow: 0 0 20px #00ffff;
            box-sizing: border-box;
        }

        /* НАСТРОЙКИ ДЛЯ БОЛЬШИХ ЭКРАНОВ (ПК) */
        @media (min-width: 600px) {
            input[type="text"] {
                font-size: 26px; /* Фиксированный крупный шрифт для мониторов */
            }
            #formBlock {
                margin-top: 15vh; /* Корректировка высоты для ПК */
            }
        }
    </style>
</head>
<body>

<div id="formBlock">
    <h2>Введи своё имя</h2>
    <input type="text" id="nameInput" placeholder="" autocomplete="off">
    <img src="ok.png" id="okButton" alt="OKEY">
</div>

<div id="messageBlock" style="display:none;">
    <h1 id="messageText"></h1>
</div>

<!-- Музыка -->
<audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
    Ваш браузер не поддерживает аудио.
</audio>

<script>
    const okButton = document.getElementById('okButton');
    const nameInput = document.getElementById('nameInput');
    const formBlock = document.getElementById('formBlock');
    const messageBlock = document.getElementById('messageBlock');
    const messageText = document.getElementById('messageText');
    const bgMusic = document.getElementById('bgMusic');

    okButton.addEventListener('click', () => {
        const name = nameInput.value.trim();
        if (name !== "") {
            bgMusic.play().catch(e => console.log("Музыка заблокирована браузером"));
            formBlock.style.display = 'none';
            messageBlock.style.display = 'block';
            messageText.innerText = `Привет, ${name}!`;
        } else {
            alert("Пожалуйста, введи имя!");
        }
    });

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('SW зарегистрирован!'));
        });
    }
</script>
</body>
</html>
