<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Привет, name!</title>
    
    <!-- ПОДКЛЮЧАЕМ МАНИФЕСТ -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            color: #ffffff;
            /* ВАШ ФОН: nik.png */
            background-image: url('nik.png'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #000000;
            height: 100vh;
            overflow: hidden;
        }

        /* Центрируем блок с полем и кнопкой */
        .center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Блок под размеры вашей радужной рамки */
        #formBlock {
            width: 610px;  
            height: 140px; 
            position: relative;
            background: transparent; /* Делаем прозрачным, чтобы видеть радугу сзади */
            padding: 0;
        }

        #formBlock h2 {
            display: none; /* Скрываем текст, ведь на картинке уже есть ENTER YOUR NAME */
        }

        /* Поле ввода — встает ровно в левое черное окошко */
        input[type="text"] {
            position: absolute;
            left: 11%;
            top: 52%;
            transform: translateY(-50%);
            width: 40%;
            height: 42px;
            background: transparent; 
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 24px;
            font-weight: bold;
            font-family: sans-serif;
            padding: 0 10px;
            box-sizing: border-box;
        }

        /* ВАША КНОПКА: ok.png (встает ровно поверх нарисованной OKEY) */
        #okButton {
            position: absolute;
            right: 11%;
            top: 52%;
            transform: translateY(-50%);
            width: 32%; 
            height: auto;
            cursor: pointer;
            transition: transform 0.1s ease, filter 0.2s ease;
        }

        #okButton:hover {
            filter: brightness(1.2);
        }

        #okButton:active {
            transform: translateY(-50%) scale(0.95);
        }

        /* Блок финального сообщения */
        #messageBlock {
            background: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border-radius: 15px;
            min-width: 300px;
            border: 3px solid #00ffff;
            box-shadow: 0 0 20px #00ffff;
        }
    </style>
</head>
<body>

<div class="center" id="formBlock">
    <h2>Введи своё имя</h2>
    <input type="text" id="nameInput" placeholder="" autocomplete="off">
    <!-- ЗДЕСЬ СТАВИМ ВАШУ КНОПКУ ok.png -->
    <img src="ok.png" id="okButton" alt="OKEY">
</div>

<div class="center" id="messageBlock" style="display:none;">
    <h1 id="messageText"></h1>
</div>

<!-- Музыка -->
<audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
    Ваш browser не поддерживает аудио.
</audio>

<script>
    // Логика работы кнопки
    const okButton = document.getElementById('okButton');
    const nameInput = document.getElementById('nameInput');
    const formBlock = document.getElementById('formBlock');
    const messageBlock = document.getElementById('messageBlock');
    const messageText = document.getElementById('messageText');
    const bgMusic = document.getElementById('bgMusic');

    okButton.addEventListener('click', () => {
        const name = nameInput.value.trim();
        if (name !== "") {
            bgMusic.play().catch(e => console.log("Музыка заблокирована браузером"));
            formBlock.style.display = 'none';
            messageBlock.style.display = 'block';
            messageText.innerText = `Привет, ${name}!`;
        } else {
            alert("Пожалуйста, введи имя!");
        }
    });

    // РЕГИСТРАЦИЯ SERVICE WORKER
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('SW зарегистрирован!'));
        });
    }
</script>
</body>
</html>
