<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Привет, name!</title>
    
    <!-- ПОДКЛЮЧАЕМ МАНИФЕСТ -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            color: #ffffff;
            background-color: #111111; /* Тёмная подложка, пока грузится фото */
            background-image: url('bg1.jpg'); /* Стартовый фон до ввода имени */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            transition: background-image 0.8s ease;
            height: 100vh;
        }
        .center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        #formBlock {
            background: rgba(0,0,0,0.6);
            padding: 20px;
            border-radius: 10px;
        }
        #messageBlock {
            background: rgba(0,0,0,0.6);
            padding: 20px;
            border-radius: 10px;
            min-width: 260px;
        }
        input[type="text"] {
            padding: 8px 12px;
            font-size: 16px;
        }
        button {
            padding: 8px 16px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="center" id="formBlock">
    <h2>Введи своё имя</h2>
    <input type="text" id="nameInput" placeholder="name">
    <button id="okButton">OK</button>
</div>

<div class="center" id="messageBlock" style="display:none;">
    <h1 id="messageText"></h1>
</div>

<!-- Музыка (loop для зацикливания) -->
<audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
    Ваш браузер не поддерживает аудио.
</audio>

<script>
    // РЕГИСТРАЦИЯ SERVICE WORKER
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('SW зарегистрирован!'))
                .catch(err => console.log('Ошибка SW:', err));
        });
    }

    const okButton = document.getElementById('okButton');
    const nameInput = document.getElementById('nameInput');
    const formBlock = document.getElementById('formBlock');
    const messageBlock = document.getElementById('messageBlock');
    const messageText = document.getElementById('messageText');
    const bgMusic = document.getElementById('bgMusic');

const slides = [
        {
            image: 'bg1.jpg',
            text: name => `Ты самый классный, ${name}!`
        },
        {
            image: 'bg2.jpg',
            text: name => `Сегодня самый хороший день, ${name}!`
        },
        {
            image: 'bg3.jpg',
            text: name => `У тебя, ${name}, классное имя!`
        },
        {
            image: '1.jpg',
            text: name => `${name}, ты заставляешь этот мир улыбаться!`
        },
        {
            image: '2.jpg',
            text: name => `Пусть сегодня сбудется твоя мечта, ${name}!`
        },
        {
            image: '3.jpg',
            text: name => `${name}, ты умеешь заряжать позитивом!`
        },
        {
            image: '4.jpg',
            text: name => `С каждым днём ты становишься лучше, ${name}!`
        },
        {
            image: '5.jpg',
            text: name => `${name}, пусть этот день принесёт тебе супер-успех!`
        },
        {
            image: '6.jpg',
            text: name => `Ты делаешь всё правильно, ${name}, так держать!`
        }
    ];

    let currentIndex = 0;
    let intervalId = null;

    okButton.addEventListener('click', () => {
        const name = nameInput.value.trim();
        if (!name) {
            alert('Введите имя!');
            return;
        }

        formBlock.style.display = 'none';
        messageBlock.style.display = 'block';

        bgMusic.play().catch(() => {
            console.log('Автовоспроизведение заблокировано браузером.');
        });

        showSlide(name);

        intervalId = setInterval(() => {
            showSlide(name);
        }, 5000);
    });

    function showSlide(name) {
        const slide = slides[currentIndex];
        document.body.style.backgroundImage = `url('${slide.image}')`;
        messageText.textContent = slide.text(name);

        currentIndex++;
        if (currentIndex >= slides.length) {
            currentIndex = 0;
        }
    }
</script>

</body>
</html>
