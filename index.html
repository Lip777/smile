<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Привет, name!</title>
    
    <!-- ПОДКЛЮЧАЕМ МАНИФЕСТ -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            color: #ffffff;
            /* УСТАНАВЛИВАЕМ ФОН НА ВСЮ СТРАНИЦУ */
            background-image: url('nik.png'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #000000;
            height: 100vh;
        }

        /* Центрируем форму ровно посередине экрана */
        .center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Красивое аккуратное окошко для ввода */
        #formBlock {
            background: rgba(0, 0, 0, 0.75); /* Полупрозрачный черный фон */
            padding: 30px;
            border-radius: 15px;
            border: 3px solid #ff00ff; /* Неоновая розовая рамка */
            box-shadow: 0 0 20px #ff00ff; /* Свечение рамки */
            min-width: 300px;
        }

        #formBlock h2 {
            margin-top: 0;
            font-size: 22px;
            letter-spacing: 1px;
        }

        /* Стильное поле ввода имени */
        input[type="text"] {
            padding: 10px 15px;
            font-size: 18px;
            border: 2px solid #00ffff; /* Неоновая голубая рамка */
            background: #111;
            color: #fff;
            border-radius: 5px;
            outline: none;
            width: 80%;
            margin-bottom: 20px;
            text-align: center;
        }

        /* Кнопка в виде вашей картинки OKEY */
        #okButton {
            display: block;
            margin: 0 auto;
            width: 150px; /* Ширина вашей желтой кнопки */
            height: auto;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        #okButton:active {
            transform: scale(0.95); /* Эффект нажатия */
        }

        /* Блок финального сообщения */
        #messageBlock {
            background: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border-radius: 15px;
            min-width: 300px;
            border: 3px solid #00ffff;
            box-shadow: 0 0 20px #00ffff;
        }
    </style>
</head>
<body>

<!-- Форма ввода (теперь она ровная, по центру и в красивой рамке) -->
<div class="center" id="formBlock">
    <h2>ВВЕДИ СВОЁ ИМЯ</h2>
    <input type="text" id="nameInput" placeholder="..." autocomplete="off">
    <!-- Кнопка-картинка OKEY -->
    <img src="ok.png" id="okButton" alt="OKEY">
</div>

<!-- Блок с сообщением -->
<div class="center" id="messageBlock" style="display:none;">
    <h1 id="messageText"></h1>
</div>

<!-- Музыка -->
<audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
    Ваш браузер не поддерживает аудио.
</audio>

<script>
    // Логика работы кнопки
    const okButton = document.getElementById('okButton');
    const nameInput = document.getElementById('nameInput');
    const formBlock = document.getElementById('formBlock');
    const messageBlock = document.getElementById('messageBlock');
    const messageText = document.getElementById('messageText');
    const bgMusic = document.getElementById('bgMusic');

    okButton.addEventListener('click', () => {
        const name = nameInput.value.trim();
        if (name !== "") {
            // Включаем музыку
            bgMusic.play().catch(e => console.log("Музыка заблокирована браузером"));
            
            // Показываем сообщение
            formBlock.style.display = 'none';
            messageBlock.style.display = 'block';
            messageText.innerText = `Привет, ${name}!`;
        } else {
            alert("Пожалуйста, введи имя!");
        }
    });

    // РЕГИСТРАЦИЯ SERVICE WORKER
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('SW зарегистрирован!'));
        });
    }
</script>
</body>
</html>
