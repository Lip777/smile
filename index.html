<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Привет, name!</title>
    
    <!-- ПОДКЛЮЧАЕМ МАНИФЕСТ -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            color: #ffffff;
            /* УКАЖИТЕ ССЫЛКУ НА ВАШУ КАРТИНКУ НИЖЕ */
            background-image: url('nik.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 0.8s ease;
            height: 100vh;
        }
        .center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        #formBlock {
            background: rgba(0,0,0,0.6);
            padding: 20px;
            border-radius: 10px;
        }
        #messageBlock {
            background: rgba(0,0,0,0.6);
            padding: 20px;
            border-radius: 10px;
            min-width: 260px;
        }
        input[type="text"] {
            padding: 8px 12px;
            font-size: 16px;
        }
        button {
            padding: 8px 16px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="center" id="formBlock">
    <h2>Введи своё имя</h2>
    <input type="text" id="nameInput" placeholder="name">
    <button id="okButton">OK</button>
</div>

<div class="center" id="messageBlock" style="display:none;">
    <h1 id="messageText"></h1>
</div>

<!-- Музыка (loop для зацикливания) -->
<audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
    Ваш браузер не поддерживает аудио.
</audio>

<script>
    // РЕГИСТРАЦИЯ SERVICE WORKER
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('SW зарегистрирован!'));
        });
    }
</script>
</body>
</html>
